name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          for file in index.js client.js host/*.js test/*.mjs; do
            node --check "$file"
          done
      - name: Host suite
        run: node test/mcp.smoke.mjs
      - name: Foreign-entry and migration suite
        run: node test/external.smoke.mjs
      - name: Migration race suite
        run: node test/takeover-race.smoke.mjs
      - name: Profile patch repair suite
        run: node test/patch-repair.smoke.mjs
